baseURL: https://PedestrianDynamics.github.io
languageCode: en-us
title: Pedestrian Dynamics

markup:
  goldmark:
    renderer:
      unsafe: true

# last-updated dates from the last commit touching each page
enableGitInfo: true

module:
  imports:
    - path: github.com/imfing/hextra

menu:
  main:
    - name: About
      pageRef: /about
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search
    - name: GitHub
      weight: 5
      url: "https://github.com/PedestrianDynamics/PedestrianDynamics.github.io"
      params:
        icon: github

params:
  navbar:
    displayTitle: true
    displayLogo: false

  page:
    width: wide

  footer:
    displayCopyright: true
    displayPoweredBy: false

  displayUpdatedDate: true

  # sections included in the site-wide feed at /index.xml
  rss:
    sections: [notes, academic_update]
  dateFormat: "January 2, 2006"

