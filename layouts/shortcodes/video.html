{{- $src := .Get "src" -}}
{{- with .Page.Resources.Get $src }}{{ $src = .RelPermalink }}{{ else }}{{ $src = $src | relURL }}{{ end -}}
<figure>
    <video autoplay loop muted playsinline preload="auto" style="max-width: 100%">
        <source src="{{ $src }}" type="video/mp4">
    </video>
    {{ with .Get "caption" }}<figcaption>{{ . | markdownify }}</figcaption>{{ end }}
</figure>
