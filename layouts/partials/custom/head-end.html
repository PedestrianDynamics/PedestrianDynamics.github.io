{{- with site.Home.OutputFormats.Get "rss" }}
<link rel="alternate" type="application/rss+xml" href="{{ .Permalink }}" title="{{ site.Title }}" />
{{- end }}
{{- if not .IsHome }}
{{- with .OutputFormats.Get "rss" }}
<link rel="alternate" type="application/rss+xml" href="{{ .Permalink }}" title="{{ site.Title }} – {{ $.Title }}" />
{{- end }}
{{- end }}
{{- if hasPrefix .RelPermalink "/academic_update/tgf26/" }}
<link rel="icon" href="/tgf26-favicon.svg" type="image/svg+xml" />
{{- end }}
